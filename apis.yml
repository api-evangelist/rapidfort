aid: rapidfort
name: RapidFort
description: >-
  RapidFort is a software supply chain security platform focused on container
  hardening and automated CVE remediation. Its platform analyzes container
  vulnerabilities across build and runtime, profiles what software actually
  executes, and removes unused components to shrink the attack surface -
  remediating up to 95% of CVEs without code changes. RapidFort publishes a
  registry of 9,000+ near-zero-CVE curated container images and malware-scanned
  open-source libraries, and its CART capability automates compliance validation
  and remediation reporting for programs such as FedRAMP, cATO, CMMC, NIS2, and
  SOC 2. The company operates its platform through a hosted web application and a
  command-line workflow (analyze, profile, harden), with an open-source
  community-images catalog and the Kimia Kubernetes-native OCI image builder
  published on GitHub.
